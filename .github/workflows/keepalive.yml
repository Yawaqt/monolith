# Keeps the free Supabase project awake: Supabase pauses free projects after a week without activity.
# Runs every 3 days and makes one small read-only request (the public list of upcoming events).
name: Supabase wach halten
on:
  schedule:
    - cron: '17 4 */3 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Anfrage an die Datenbank
        run: |
          URL=$(grep -oE "SUPABASE_URL: *'[^']+'" assets/config.js | sed -E "s/.*'([^']+)'/\1/")
          KEY=$(grep -oE "SUPABASE_ANON_KEY: *'[^']+'" assets/config.js | sed -E "s/.*'([^']+)'/\1/")
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/rest/v1/rpc/public_events" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "Antwort: $code"
          test "$code" = "200"
